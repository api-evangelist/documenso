meters:
- name: subscription_seat
  description: Flat monthly subscription charge per plan (Individual, Teams base, Platform).
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: additional_user
  description: Per-seat charge for Teams users beyond the included five, at $8/user/month.
  unit: users
  aggregation: sum
  dimensions:
  - account
  - team
- name: documents
  description: Documents created; metered as a cap on the Free tier, unlimited on paid and self-hosted.
  unit: documents
  aggregation: sum
  dimensions:
  - account
  - plan
- name: self_hosted_infrastructure
  description: Self-managed compute, storage, and operations cost for AGPL self-hosted deployments (no vendor fee).
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - environment
principles:
- name: Visibility
  description: Track active plan, seat count, and document volume against plan caps; for self-hosted, attribute infrastructure cost.
- name: Allocation
  description: Tag API tokens and teams per workload; map subscriptions and seats to internal cost centers.
- name: Optimization
  description: Right-size the plan to actual seat and document volume; consider self-hosting under AGPL to eliminate subscription fees when ops capacity exists.
- name: Accountability
  description: Assign owners per team/subscription; review seat growth and plan tier monthly against budget.
maintainers:

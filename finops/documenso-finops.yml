description: >-
  FinOps view of Documenso spend. Documenso bills via flat monthly cloud
  subscriptions (Free, Individual, Teams, Platform, Enterprise) rather than
  per-API-call usage, with Teams adding a per-seat charge for users beyond the
  included five. The self-hosted open-source edition (AGPL-3.0) has no
  subscription fee, shifting cost to self-managed infrastructure and operations.
notes: >-
  Subscription prices are subject to change; verify against the Documenso
  pricing page during reconciliation. Self-hosted total cost of ownership is
  driven by infrastructure, not vendor billing.
sources:
- https://documenso.com/pricing
- https://docs.documenso.com/developers/public-api

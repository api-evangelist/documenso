name: Documenso
kind: company
description: Documenso is the open-source DocuSign alternative, a developer-friendly
  e-signature platform for sending, signing, and managing documents. Its public REST
  API lets you create and upload documents, add recipients and signature fields, send
  documents for signing, work with reusable templates, and receive webhook events
  across the document lifecycle. Self-hostable under AGPL.
